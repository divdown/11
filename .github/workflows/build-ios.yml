name: Build iPhone app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        env:
          SOURCE_ZIP: 
        run: |
          python3 - <<'PY'
          import base64, io, os, zipfile
          archive = zipfile.ZipFile(io.BytesIO(base64.b64decode(os.environ['SOURCE_ZIP'])))
          archive.testzip()
          archive.extractall('.')
          PY
      - name: Compile for iPhone
        run: |
          xcodebuild -project PhotoSwipe.xcodeproj -scheme PhotoSwipe -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/PhotoSwipe.app package/Payload/
          cd package
          zip -qr ../PhotoSwipe-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSwipe-iPhone
          path: PhotoSwipe-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
